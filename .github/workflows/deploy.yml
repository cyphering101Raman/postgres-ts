name: Learning- Deploy to EC2/Dockerized

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Version Tag
        id: version
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          TAG="v${{ github.run_number }}-${SHORT_SHA}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/todo-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/todo-backend:${{ steps.version.outputs.tag }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # 1. We need the code on the runner so we can copy the file
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Securely copy docker-compose.yml to the EC2 server
      - name: Copy docker-compose to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/docker-compose.yml"
          target: "~/postgres-ts/"

      # 3. SSH in and run Docker commands (no git pull needed!)
      - name: Execute SSH Commands on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/postgres-ts/backend
            
            # Safely update or append APP_VERSION in the .env file
            grep -q "^APP_VERSION=" .env && sed -i "s/^APP_VERSION=.*/APP_VERSION=${{ needs.build-and-push.outputs.image_tag }}/" .env || echo "APP_VERSION=${{ needs.build-and-push.outputs.image_tag }}" >> .env
            
            sudo docker compose pull
            sudo docker compose up -d

